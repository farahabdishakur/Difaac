name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two vulnerabilities reached the production tree before this job
      # existed and were found by hand. Nothing catches that reliably except
      # a machine that checks on every push.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm production dependencies
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pip-audit reads the advisory database rather than the lockfile's own
      # opinion, so a pinned version with a known CVE is reported even though
      # the pin is exactly what was asked for.
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict
