# Production stack for a single VPS (e.g. a Hostinger VPS).
#
# Four services on one host: PostgreSQL, the FastAPI backend, the built
# frontend served by nginx, and Caddy in front terminating TLS and routing
# everything from a single domain. Postgres data lives on a named volume — a
# real store that survives redeploys. See DEPLOY.md for the backup add-on.
#
# Set a strong POSTGRES_PASSWORD in a root .env file before the first start;
# it is used both by the database and by the backend's DATABASE_URL.
#
# Start:   docker compose up -d --build
# Update:  git pull && docker compose up -d --build
# Logs:    docker compose logs -f

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=difaac
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in a root .env file before the first start}
      - POSTGRES_DB=difaac
      # Read by the init script above to set the application role's password.
      # Separate from POSTGRES_PASSWORD on purpose: the superuser credential
      # and the credential the application holds should not be the same
      # secret, because the application's is the one exposed to the app.
      - DIFAAC_APP_DB_PASSWORD=${DIFAAC_APP_DB_PASSWORD:?DIFAAC_APP_DB_PASSWORD is required — set it in a root .env file before the first start}
    volumes:
      - difaac_pgdata:/var/lib/postgresql/data
      # Runs once, on the first start of an empty volume, as the bootstrap
      # superuser. It creates the ordinary role the application connects as.
      #
      # POSTGRES_USER above is a SUPERUSER — that is what the image makes it —
      # and a superuser is exempt from row-level security no matter what the
      # policies say. The backend used to connect as it, which left every
      # tenant isolation policy inert on a running server. It now connects as
      # difaac_app, created here with NOSUPERUSER NOBYPASSRLS.
      #
      # On an existing deployment this file does NOT run, because the volume
      # is not empty. See DEPLOY.md for the one command to run by hand.
      - ./scripts/init-app-role.sql:/docker-entrypoint-initdb.d/10-init-app-role.sql:ro
    # The backend waits on this: it will not start until the database is
    # actually accepting connections, not merely running.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U difaac -d difaac"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published to the host — only the backend reaches it over the internal
    # network.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DIFAAC_DEBUG=false
      # difaac_app, never the superuser: row-level security does not apply to
      # a superuser, so connecting as one silently switches tenant isolation
      # off while leaving every policy in place.
      - DATABASE_URL=postgresql://difaac_app:${DIFAAC_APP_DB_PASSWORD:?DIFAAC_APP_DB_PASSWORD is required — set it in a root .env file before the first start}@db:5432/difaac
      # Caddy is the only thing that can reach this container — the port is
      # `expose`d on the internal network, never published to the host — so the
      # forwarded address it sets is the real client and can be believed.
      # Without this every visitor is counted as one client and the auth rate
      # limit of ten per minute applies to the entire internet combined.
      # 172.16/12 is the range Docker allocates its bridge networks from.
      - DIFAAC_TRUSTED_PROXIES=172.16.0.0/12
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host: only Caddy reaches it, over the internal
    # network. The API is never exposed directly.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty means "same origin": the browser calls /api/... on the domain
        # it is already on, and Caddy routes it to the backend. This is what
        # lets the auth cookie stay a simple same-site cookie.
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  difaac_pgdata:
  caddy_data:
  caddy_config:
