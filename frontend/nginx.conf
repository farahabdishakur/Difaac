# Static serving for the Difaac SPA.
#
# This server does one job: hand out the built assets, and fall back to
# index.html for any path it does not recognise so that client-side routes
# survive a hard refresh. Every /api and /auth request is routed to the
# backend by the reverse proxy in front of this container, so no proxying
# happens here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached
    # hard. index.html must not be — a stale one would point at assets that
    # no longer exist after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compress text responses. Images and the like are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # This app is served only over the HTTPS the reverse proxy terminates, and
    # loads no third-party scripts. The header set is intentionally small;
    # the API sets its own stricter policy on its own responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
