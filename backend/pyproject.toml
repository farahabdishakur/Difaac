[project]
name = "backend"
version = "0.1.0"
description = "Difaac FastAPI + PostgreSQL backend"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.128.1", "pydantic>=2.0.0", "bcrypt>=4.0.0", "pyjwt>=2.8.0"]

[tool.pytest.ini_options]
# `backend/` on the path, so `app` and `tests.helpers` both resolve however
# pytest is invoked. Without it the suite only works when run as
# `python -m pytest` from this directory, because that is what happened to put
# the current directory on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
