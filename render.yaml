# Render Blueprint — the whole Difaac stack in one file.
#
# Render → New → Blueprint → connect this repo → Apply. Render reads this and
# creates the database, the API, and the static site together, with every
# environment variable already set. Nothing is typed by hand, which is the
# point: the one deploy that failed did so because a single variable
# (DIFAAC_SECRET_KEY) was missed in the dashboard. Here it is generated
# automatically and cannot be forgotten.
#
# The two cross-links between the site and the API use the predicted
# onrender.com hostnames below. If Render appends a suffix because a name is
# taken (difaac-api-xxxx.onrender.com), fix the three URL values marked
# "# EDIT IF RENAMED" after the first apply and redeploy. Everything else is
# self-contained and needs no attention.
#
# See RENDER.md for the manual, click-by-click alternative and the reasoning.

databases:
  - name: difaac-db
    databaseName: difaac
    plan: free
    region: frankfurt          # closest Render region to the Horn of Africa

services:
  # ---------------------------------------------------------------------------
  # The API — FastAPI under gunicorn, built from backend/Dockerfile.
  # ---------------------------------------------------------------------------
  - type: web
    name: difaac-api
    runtime: docker
    region: frankfurt          # must match the database's region
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DIFAAC_DEBUG
        value: "false"

      # The full postgres:// connection string, taken from the database above.
      # This is the piece that has to be right and is easiest to get wrong by
      # hand; Render fills it in.
      - key: DATABASE_URL
        fromDatabase:
          name: difaac-db
          property: connectionString

      # Generated once by Render, stored as a secret, never shown in the repo.
      # This is what removes the manual step that broke the first deploy.
      - key: DIFAAC_SECRET_KEY
        generateValue: true

      # This is the public showcase instance, so it ships populated: demo
      # threat data across every console, plus the demo logins below. On a real
      # customer instance both of these are "false" — a live console must never
      # show fabricated alerts, and the demo logins are public passwords.
      - key: DIFAAC_SEED_DEMO
        value: "true"

      # Public, known-password demo logins (admin/analyst/viewer + a hospital
      # admin). Showcase only — never "true" where real data lives.
      - key: DIFAAC_SEED_DEMO_ACCOUNTS
        value: "true"

      # The browser only ever talks to difaac.onrender.com; the site proxies
      # /api and /auth to this service (see the static site's routes below), so
      # the session cookie is first-party and a plain Lax cookie is correct.
      # This is what makes sign-in survive in browsers that block third-party
      # cookies — which is most of them now, and was why the cross-site
      # (SameSite=None) setup logged people straight back out.
      - key: DIFAAC_COOKIE_SAMESITE
        value: lax

      # Render's load balancer sits in front of the API on its private
      # network. Without this the rate limiter counts every caller as one.
      - key: DIFAAC_TRUSTED_PROXIES
        value: 10.0.0.0/8

      - key: DIFAAC_CORS_ORIGINS
        value: https://difaac.onrender.com           # EDIT IF RENAMED

      - key: DIFAAC_FRONTEND_URL
        value: https://difaac.onrender.com           # EDIT IF RENAMED

  # ---------------------------------------------------------------------------
  # The site — the built React app, served as static files.
  # ---------------------------------------------------------------------------
  # Named plainly "difaac" so the public URL is difaac.onrender.com rather than
  # difaac-site.onrender.com. The API keeps the -api suffix; only the site,
  # which is what people visit, takes the bare name.
  - type: web
    name: difaac
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    branch: main
    envVars:
      # Empty means "same origin": the app calls /api and /auth on its own
      # domain, and the rewrites below proxy those to the API. Keeping the
      # browser on one origin is what avoids the third-party session cookie.
      - key: VITE_API_URL
        value: ""
    routes:
      # Proxy the API through the site's own origin. Order matters — these must
      # come before the SPA catch-all, or /api/* would be rewritten to
      # index.html. EDIT the host if the API service was renamed.
      - type: rewrite
        source: /api/*
        destination: https://difaac-api.onrender.com/api/*
      - type: rewrite
        source: /auth/*
        destination: https://difaac-api.onrender.com/auth/*
      # A hard refresh of any client-side route must return index.html rather
      # than a 404.
      - type: rewrite
        source: /*
        destination: /index.html
